# Postet den nächsten fälligen Beitrag aus queue/ auf Instagram, gestartet zur festen Uhrzeit je Wochentag.
# Details: tools/publish.py

name: Publish

on:
  schedule:
    # Gepostet wird über geplante Aufgaben in Claude zur festen Uhrzeit je Wochentag (workflow_dispatch, Modus posten).
    # Dieser Lauf holt nur nach, falls eine davon ausgefallen ist. GitHub startet Zeitplan-Läufe oft Stunden später.
    - cron: '7 12 * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'anzeigen: nur fällige Beiträge zeigen. pruefen: Container des nächsten Beitrags bauen, nichts posten. posten: nächsten fälligen Beitrag posten.'
        type: choice
        options: [anzeigen, pruefen, posten]
        default: anzeigen

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fällige Beiträge posten
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          MODUS: ${{ github.event.inputs.modus }}
        run: |
          # Neuesten Stand holen: Wartet dieser Lauf in der Concurrency-Gruppe auf einen anderen,
          # ist dessen Beitrag schon in posted/ und wird nicht ein zweites Mal gepostet.
          git pull -q --ff-only origin main
          # Zeitplan-Läufe haben keinen Modus und posten.
          case "${MODUS:-posten}" in
            anzeigen) python3 tools/publish.py ;;
            pruefen)  python3 tools/publish.py --check ;;
            posten)   python3 tools/publish.py --publish ;;
          esac

      - name: Gepostetes nach posted/ committen
        run: |
          git config user.name "wsc-publish"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue posted
          if git diff --cached --quiet; then
            echo "nichts zu committen"
          else
            git commit -m "posted: $(ls -t posted | head -1)"
            # main bekommt stündlich Commits (Workflow Live). Ohne Rebase scheitert der Push,
            # der Beitrag bliebe in queue/ und würde beim nächsten Lauf ein zweites Mal gepostet.
            for i in 1 2 3 4 5; do
              git pull --rebase -q origin main && git push && exit 0
              sleep $((i * 10))
            done
            echo "::error::Push nach dem Posten gescheitert. queue/ von Hand bereinigen, sonst wird doppelt gepostet."
            exit 1
          fi

      # Hält plan/index.json aktuell (Feld slot, auto_posted), damit /studio/posts/ zeigt, was automatisch läuft.
      # Eigener Schritt nach dem Commit oben: Scheitert er, ist der Beitrag trotzdem sicher in posted/.
      - name: plan/index.json aktualisieren
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            git pull --rebase -q origin main || { git rebase --abort; sleep 10; continue; }
            python3 tools/plan_index.py
            git add plan/index.json
            if git diff --cached --quiet; then echo "index.json unverändert"; exit 0; fi
            git commit -q -m "plan/index.json: Stand nach Publish"
            git push && exit 0
            git reset -q --hard origin/main
            sleep $((i * 10))
          done
          echo "::warning::plan/index.json nicht aktualisiert. Von Hand: python3 tools/plan_index.py"
