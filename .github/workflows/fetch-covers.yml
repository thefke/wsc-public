# Lädt Cover-Bilder auf den Branch cover-cache.
#
# Hintergrund: Claude-Sessions erreichen covers.openlibrary.org nicht, GitHub
# Actions schon. Zum Rendern eines Posts in der Session holt dieser Workflow die
# Cover und legt sie auf den Branch cover-cache. Die Session holt sie per git.
# Der Branch wird bei jedem Lauf überschrieben und enthält nur die letzten Cover.
#
# Eingabe: eine URL pro Zeile.

name: Fetch Covers

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Cover-URLs, durch Leerzeichen oder Zeilenumbruch getrennt'
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Cover laden
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          mkdir covers
          i=0
          for u in $URLS; do
            name=$(echo -n "$u" | sha1sum | cut -c1-16)
            if curl -sSfL --retry 3 -o "covers/$name.jpg" "$u"; then
              echo "$name $u" >> covers/index.txt
              i=$((i+1))
            else
              echo "FEHLT $u" | tee -a covers/index.txt
            fi
          done
          echo "$i Cover geladen" >> "$GITHUB_STEP_SUMMARY"

      - name: Auf cover-cache ablegen
        run: |
          cd covers
          git init -q -b cover-cache
          git config user.name "wsc-covers"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Cover für einen Render-Lauf"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cover-cache
