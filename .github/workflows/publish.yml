# Postet stündlich den nächsten fälligen Beitrag aus queue/ auf Instagram.
# Details: tools/publish.py

name: Publish

on:
  schedule:
    - cron: '7 * * * *'   # jede Stunde zu Minute 7, GitHub startet Cron-Läufe oft einige Minuten später
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur anzeigen, was fällig ist'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fällige Beiträge posten
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 tools/publish.py
          else
            python3 tools/publish.py --publish
          fi

      - name: Gepostetes nach posted/ committen
        run: |
          git config user.name "wsc-publish"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue posted
          if git diff --cached --quiet; then
            echo "nichts zu committen"
          else
            git commit -m "posted: $(ls -t posted | head -1)"
            git push
          fi
